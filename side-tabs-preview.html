/* ลำดับการซ้อน: แถบอยู่ขอบขวา ยื่นออกนอกหน้ากระดาษ */
.tabs{
  position:absolute; top:24%; left:100%; width:8.5cqw; height:62%;
  display:flex; flex-direction:column; margin:0; padding:0; list-style:none;
}
.tabs li{flex:1; min-height:0; position:relative}
.tab{
  all:unset; box-sizing:border-box; cursor:pointer;
  position:absolute; inset:0 auto 0 0; width:100%;
  display:flex; flex-direction:column; align-items:center; justify-content:flex-start; gap:2.2cqw;
  padding:2.4cqw 0 1.6cqw;
  border-radius:0 2.2cqw 2.2cqw 0;
  background:linear-gradient(90deg,var(--navy-900),var(--navy-700));
  color:#fff;
  box-shadow:inset 0 -1px 0 var(--gold), inset -1px 0 0 rgba(255,255,255,.12), 3px 4px 10px -4px rgba(0,16,67,.55);
  transition:width .25s ease, background .25s ease, color .25s ease;
}
.tabs li:nth-child(2) .tab{background:linear-gradient(90deg,#00124F,#1A3384)}
.tabs li:nth-child(3) .tab{background:linear-gradient(90deg,#001043,#1E3A8F)}
.tabs li:nth-child(4) .tab{background:linear-gradient(90deg,#00124F,#2A4494)}
.tab:hover{width:122%}
.tab:focus-visible{outline:2px solid var(--gold-light); outline-offset:2px}
.tab[aria-selected="true"]{
  width:136%; color:var(--navy-900);
  background:linear-gradient(90deg,var(--gold),var(--gold-light)) !important;
  box-shadow:inset 0 -1px 0 rgba(0,16,67,.25), 4px 5px 12px -4px rgba(0,16,67,.55);
}
.num{
  font-weight:700; font-size:3.1cqw; line-height:1; color:var(--gold-light);
  padding-bottom:1.6cqw; border-bottom:1px solid currentColor; width:56%; text-align:center;
}
.tab[aria-selected="true"] .num{color:var(--navy-900)}
.label{
  writing-mode:vertical-rl; display:flex; flex-direction:row; gap:.8cqw; align-items:flex-start;
  font-size:2.7cqw; line-height:1.1; white-space:nowrap;
}
.th{font-weight:700}
.en{font-weight:400; opacity:.78; font-size:2.1cqw}
.caption{max-width:520px; text-align:center; font-size:14px; line-height:1.6; color:var(--ink); opacity:.8; margin:0}
.caption strong{font-weight:700}
@media (prefers-reduced-motion: reduce){ .tab{transition:none} }
@media (max-width:420px){ .caption{font-size:13px} }
</style>

<div class="stage">
  <div class="page" id="page">
    <ul class="tabs" role="tablist" aria-label="สารบัญพอร์ตโฟลิโอ">
      <li><button class="tab" role="tab" aria-selected="true" data-name="ประวัติส่วนตัว"><span class="num">01</span><span class="label"><span class="en">Profile</span><span class="th">ประวัติส่วนตัว</span></span></button></li>
      <li><button class="tab" role="tab" aria-selected="false" data-name="ประวัติการศึกษา"><span class="num">02</span><span class="label"><span class="en">Education</span><span class="th">ประวัติการศึกษา</span></span></button></li>
      <li><button class="tab" role="tab" aria-selected="false" data-name="ผลงานและเกียรติบัตร"><span class="num">03</span><span class="label"><span class="en">Achievement</span><span class="th">ผลงานและเกียรติบัตร</span></span></button></li>
      <li><button class="tab" role="tab" aria-selected="false" data-name="ประสบการณ์ฝึกสอน"><span class="num">04</span><span class="label"><span class="en">Practicum</span><span class="th">ประสบการณ์ฝึกสอน</span></span></button></li>
    </ul>
  </div>
</div>
<p class="caption" id="caption">กำลังเลือก: <strong>01 ประวัติส่วนตัว</strong><br>คลิกที่แถบเพื่อลองสลับ แถบที่เลือกจะยื่นออกมาเป็นสีทอง</p>
<script>
(function(){
  var tabs=[].slice.call(document.querySelectorAll('.tab'));
  var cap=document.getElementById('caption');
  function select(t){
    tabs.forEach(function(x){x.setAttribute('aria-selected', x===t ? 'true':'false');});
    var n=t.querySelector('.num').textContent;
    cap.innerHTML='กำลังเลือก: <strong>'+n+' '+t.getAttribute('data-name')+'</strong><br>คลิกที่แถบเพื่อลองสลับ แถบที่เลือกจะยื่นออกมาเป็นสีทอง';
  }
  tabs.forEach(function(t,i){
    t.addEventListener('click',function(){select(t);});
    t.addEventListener('keydown',function(e){
      if(e.key==='ArrowDown'||e.key==='ArrowUp'){
        e.preventDefault();
        var j=(i+(e.key==='ArrowDown'?1:-1)+tabs.length)%tabs.length;
        tabs[j].focus(); select(tabs[j]);
      }
    });
  });
})();
</script>
</body>
</html>
